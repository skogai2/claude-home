[tools]
age = "latest"
claude = "latest"
fnox = { version = "latest", workflow = "release.yml" }
gh = "latest"
herdr = "latest"
jq = "latest"

[settings]
# mise secrets (fnox) and task secrets
experimental = true

[env]
# Machine age key created by the bootstrap task below; fnox reads it to decrypt
FNOX_AGE_KEY_FILE = "{{env.HOME}}/.ssh/local-per-machine-age.txt"

# Machine age key for fnox: created on this machine, never copied or
# committed. The public key goes into the recipients of the
# claude-and-skogix provider (see skogai/secrets.md in ~skogix/.config/skogai).
# Runs on every `mise bootstrap`, so it only creates the key if missing.
[tasks.bootstrap]
run = '''
set -eu
install -d -m 0700 "$HOME/.ssh"
key="$HOME/.ssh/local-per-machine-age.txt"
if [ ! -e "$key" ]; then
  (umask 077 && age-keygen -o "$key")
fi
chmod 0600 "$key"
# Keep the systemd user manager running without a login (boot / wake-on-LAN).
# mise doesn't manage linger; polkit lets a user set it for themselves.
# herdr's Claude hook (agent state in panes). The script is herdr-managed,
# so install it instead of vendoring it; settings.json already has the entry.
herdr integration install claude >/dev/null
loginctl enable-linger "$USER" || echo "warning: could not enable linger for $USER" >&2
echo "claude machine age recipient: $(age-keygen -y "$key")"
'''

[dotfiles]
"~/.bashrc" = { source = "dotfiles/bashrc" }
"~/.config/git/config" = { source = "dotfiles/git/config" }
# copied, not symlinked: sshd checks the real file's owner and mode
# copied: Claude Code rewrites this file itself; `mise dot status` shows drift
"~/.claude/settings.json" = { source = "dotfiles/claude/settings.json", mode = "copy" }
"~/.ssh/authorized_keys" = { source = "dotfiles/ssh/authorized_keys", mode = "copy", permissions = "0600" }
